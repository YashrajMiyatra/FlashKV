[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flashkv"
version = "1.0.0"
authors = [
  { name = "Yashraj Miyatra" }
]
description = "A lightweight, Redis-compatible in-memory database with real-time Vector Search, AOF persistence, and an interactive Web Dashboard."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
]

[project.scripts]
flashkv-server = "flashkv.run:main"
flashkv-cli = "flashkv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flashkv*"]
